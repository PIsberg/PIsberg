    <text x="36" y="54" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#F97316" letter-spacing="3">THE BOOK</text>
    <text x="36" y="98" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">Vibe Coding Architecture at Scale</text>
    <text x="36" y="136" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FBBF24">Vibe coding gives you speed. Vibe Architecture gives you scale.</text>
    <text x="36" y="172" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#CBD5E1">When syntax is free, structure is your only asset. The book on designing, scaling</text>
    <text x="36" y="195" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#CBD5E1">and guardrailing large-scale systems in the age of AI orchestration.</text>
