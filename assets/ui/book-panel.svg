    <text x="134" y="250.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#080D19" text-anchor="middle">Get it on Amazon →</text>
