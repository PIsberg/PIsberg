<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="132" viewBox="0 0 1000 132" role="img" aria-label="Building with AI agents and want it to stay correct? Get in touch: isberg.peter@gmail.com">
  <title>Building with AI agents and want it to stay correct? Get in touch: isberg.peter@gmail.com</title>
  <defs>
    <linearGradient id="bgfoot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D19"/>
      <stop offset="100%" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="acfoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="topfoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadefoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowfoot" cx="0%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="softfoot" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="clipfoot"><rect width="1000" height="132" rx="12"/></clipPath>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
  </style>
  <g clip-path="url(#clipfoot)">
    <rect width="1000" height="132" fill="url(#bgfoot)"/>
    <rect width="1000" height="132" fill="url(#glowfoot)"/>
    <rect width="1000" height="2" fill="url(#topfoot)"/>
    <text x="40" y="58" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">Building with AI agents and want it to stay correct?</text>
    <text x="40" y="92" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB9CC">isberg.peter@gmail.com   ·   deversity.se   ·   Gothenburg, Sweden</text>
    <rect x="782" y="44" width="178" height="44" rx="22" fill="url(#acfoot)"/>
    <text x="871" y="71.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#080D19" text-anchor="middle">Get in touch →</text>
    <rect x="0.5" y="0.5" width="999" height="131" rx="11.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
