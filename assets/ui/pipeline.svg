<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="372" viewBox="0 0 1000 372" role="img" aria-label="How the projects fit together. Stage 1, before it writes: skill3 teaches the agent current skills, llm-fw filters prompts before the model. Stage 2, while it writes: vibetags fences off code it must not touch, axiom shows what a change just broke, ghost-mcp gives it hands on the desktop. Stage 3, before it ships: codekoll static analysis for silent bugs, async-test-lib forces concurrency bugs to fire, codekarta maps what was actually built.">
  <title>How the projects fit together. Stage 1, before it writes: skill3 teaches the agent current skills, llm-fw filters prompts before the model. Stage 2, while it writes: vibetags fences off code it must not touch, axiom shows what a change just broke, ghost-mcp gives it hands on the desktop. Stage 3, before it ships: codekoll static analysis for silent bugs, async-test-lib forces concurrency bugs to fire, codekarta maps what was actually built.</title>
  <defs>
    <linearGradient id="bgpipe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D19"/>
      <stop offset="100%" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="acpipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="toppipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadepipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowpipe" cx="0%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="softpipe" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="clippipe"><rect width="1000" height="372" rx="12"/></clipPath>
  </defs>
