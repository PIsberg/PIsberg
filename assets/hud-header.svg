<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Peter Isberg - T-800 heads-up display. Guardrails for the machines that write the code.">
  <title>Peter Isberg - T-800 heads-up display</title>
  <defs>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5E6"/>
      <stop offset="25%" stop-color="#FF6B1A"/>
      <stop offset="60%" stop-color="#FF2A1A"/>
      <stop offset="100%" stop-color="#FF2A1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="rollGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B1A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF6B1A" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FF6B1A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0B09" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0D0B09" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0B09" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D0B09" stop-opacity="1"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect y="0" width="4" height="1" fill="#FF6B1A" opacity="0.05"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="asmClip">
      <rect x="856" y="44" width="138" height="212"/>
    </clipPath>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) { .rm { display: none; } }
  </style>

  <rect width="1000" height="300" fill="#0D0B09"/>
  <rect width="1000" height="300" fill="url(#scanlines)"/>

  <!-- CRT roll band: parked off-canvas, only visible while animating -->
  <rect class="rm" x="0" y="-80" width="1000" height="70" fill="url(#rollGrad)">
    <animate attributeName="y" values="-80;310" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Consolas, Menlo, monospace">

    <!-- T-800 eye -->
    <circle cx="115" cy="150" r="62" fill="none" stroke="#3D2A18" stroke-width="1.5"/>
    <circle cx="115" cy="150" r="46" fill="none" stroke="#B7410E" stroke-width="1" opacity="0.6"/>
    <path d="M115 72 V80 M115 220 V228 M37 150 H45 M185 150 H193" stroke="#B7410E" stroke-width="1.5" opacity="0.7"/>
    <circle cx="115" cy="150" r="54" fill="none" stroke="#FF6B1A" stroke-width="2" stroke-linecap="round" stroke-dasharray="42 297" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0 115 150" to="360 115 150" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="150" r="70" fill="none" stroke="#FF6B1A" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="16 22 40 362" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="360 115 150" to="0 115 150" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="150" r="34" fill="url(#eyeGlow)" opacity="0.95">
      <animate attributeName="r" values="32;36;32" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="150" r="16" fill="none" stroke="#FFF5E6" stroke-width="1" opacity="0.35"/>
    <circle cx="115" cy="150" r="9" fill="#FFF5E6"/>
    <text x="115" y="252" text-anchor="middle" font-size="10.5" fill="#8A8177" textLength="150">T-800 // VISUAL CORTEX</text>

    <!-- title block -->
    <text x="252" y="84" font-size="15" fill="#FF6B1A" opacity="0.85" textLength="430">CYBERDYNE SYSTEMS :: SERIES 800 :: MODEL 101</text>

    <!-- glitch echoes: invisible at rest, flash on an 8s cycle -->
    <text class="rm" x="247" y="154" font-size="58" font-weight="bold" fill="#FF2A1A" opacity="0" textLength="470">PETER ISBERG<animate attributeName="opacity" values="0;0;0.8;0;0.55;0;0" keyTimes="0;0.88;0.9;0.92;0.94;0.96;1" dur="8s" repeatCount="indefinite"/></text>
    <text class="rm" x="254" y="150" font-size="58" font-weight="bold" fill="#FF6B1A" opacity="0" textLength="470">PETER ISBERG<animate attributeName="opacity" values="0;0;0.65;0;0" keyTimes="0;0.905;0.925;0.945;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="250" y="152" font-size="58" font-weight="bold" fill="#FFF5E6" filter="url(#softGlow)" textLength="470">PETER ISBERG<animate attributeName="opacity" values="0;1;0.35;1;0.65;1" dur="0.6s" begin="0.05s" fill="remove"/></text>

    <!-- tagline: static text; curtain rests at width 0 so a frozen frame still shows it -->
    <text x="252" y="196" font-size="19" fill="#D9D2C7" textLength="560"><tspan fill="#FF6B1A">&gt;</tspan> guardrails for the machines that write the code</text>
    <rect x="828" y="178" width="0" height="25" fill="#0D0B09">
      <animate attributeName="x" calcMode="discrete" begin="0.2s" dur="3.5s" fill="remove" values="250;278.3;306.6;334.9;363.2;391.5;419.8;448.1;476.4;504.7;533;561.3;589.6;617.9;646.2;674.5;702.8;731.1;759.4;787.7;816"/>
      <animate attributeName="width" calcMode="discrete" begin="0.2s" dur="3.5s" fill="remove" values="566;537.7;509.4;481.1;452.8;424.5;396.2;367.9;339.6;311.3;283;254.7;226.4;198.1;169.8;141.5;113.2;84.9;56.6;28.3;0"/>
    </rect>
    <rect x="816" y="180" width="9" height="20" fill="#FF6B1A">
      <animate attributeName="x" calcMode="discrete" begin="0.2s" dur="3.5s" fill="remove" values="250;278.3;306.6;334.9;363.2;391.5;419.8;448.1;476.4;504.7;533;561.3;589.6;617.9;646.2;674.5;702.8;731.1;759.4;787.7;816"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- HUD stats line -->
    <text x="252" y="232" font-size="12.5" fill="#8A8177" textLength="600">PWR CELL: JAVA 26 // LOC: GOTHENBURG, SE // DIRECTIVE: NO FATE BUT WHAT WE COMPILE</text>

    <!-- scrolling 6502 column, as on the T-800 HUD in the 1984 film -->
    <g clip-path="url(#asmClip)">
      <g font-size="11.5" fill="#B7410E" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -216" dur="16s" repeatCount="indefinite"/>
        <text x="866" y="64">LDA #$00</text>
        <text x="866" y="88">STA $0320,X</text>
        <text x="866" y="112">CPX #$1E</text>
        <text x="866" y="136">BNE $F002</text>
        <text x="866" y="160">JSR $FDF0</text>
        <text x="866" y="184">LDY #$2C</text>
        <text x="866" y="208">EOR $D012</text>
        <text x="866" y="232">BPL $F00A</text>
        <text x="866" y="256">RTS</text>
        <text x="866" y="280">LDA #$00</text>
        <text x="866" y="304">STA $0320,X</text>
        <text x="866" y="328">CPX #$1E</text>
        <text x="866" y="352">BNE $F002</text>
        <text x="866" y="376">JSR $FDF0</text>
        <text x="866" y="400">LDY #$2C</text>
        <text x="866" y="424">EOR $D012</text>
        <text x="866" y="448">BPL $F00A</text>
        <text x="866" y="472">RTS</text>
      </g>
    </g>
    <rect x="856" y="44" width="138" height="26" fill="url(#fadeTop)"/>
    <rect x="856" y="230" width="138" height="26" fill="url(#fadeBot)"/>
  </g>

  <rect width="1000" height="300" fill="url(#vignette)"/>
  <rect x="0.5" y="0.5" width="999" height="299" fill="none" stroke="#3D2A18"/>
  <g stroke="#FF6B1A" stroke-width="2" fill="none" opacity="0.85" stroke-linecap="square">
    <path d="M6 26 V8 H26"/>
    <path d="M974 8 H994 V26"/>
    <path d="M6 274 V292 H26"/>
    <path d="M994 274 V292 H974"/>
  </g>
</svg>